name: Self-hosted runner readiness

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the self-hosted runner to inspect
        required: true
        default: self-hosted
      ecosystems:
        description: Comma-separated ecosystems used by your repositories
        required: true
        default: go,maven,gradle,dotnet,python,npm,ruby
      concurrent_runners:
        description: Optional number of Dependabot runners sharing this host
        required: false

jobs:
  inspect:
    runs-on: ${{ inputs.runner_label }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Inspect runner
        env:
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          CONCURRENT_RUNNERS: ${{ inputs.concurrent_runners }}
          READINESS_RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          args=(--ecosystems "$ECOSYSTEMS"
                --json-file "$RUNNER_TEMP/runner-readiness.json"
                --markdown-file "$RUNNER_TEMP/runner-readiness.md")
          if [[ -n "$CONCURRENT_RUNNERS" ]]; then
            args+=(--concurrent-runners "$CONCURRENT_RUNNERS")
          fi
          python3 scripts/runner_readiness.py "${args[@]}"
          cat "$RUNNER_TEMP/runner-readiness.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-readiness
          path: |
            ${{ runner.temp }}/runner-readiness.json
            ${{ runner.temp }}/runner-readiness.md
